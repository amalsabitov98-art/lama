  <title>Turon Tour — справочник направлений</title>
  <style>
    :root {
      --gold: #c9a84c;
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.55);
      --faint: rgba(255,255,255,.34);
      --glass: rgba(255,255,255,.07);
      --glass-hover: rgba(255,255,255,.12);
      --line: rgba(255,255,255,.12);
      --radius: 20px;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, #0f2545 0%, #1a1040 52%, #0d2535 100%);
    }
    button, a { font: inherit; }
    button { color: inherit; }
    .ambient { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
    .blob { position: absolute; width: 38vw; height: 38vw; border-radius: 50%; filter: blur(80px); opacity: .25; }
    .blob.gold { left: -10vw; top: -12vw; background: #e1ad37; }
    .blob.teal { right: -12vw; top: 18vh; background: #1eb6a4; }
    .blob.purple { left: 38vw; bottom: -20vw; background: #7d48d8; }
    .blob.blue { right: 22vw; top: -25vw; background: #2e76c9; opacity: .16; }
    .app { position: relative; z-index: 1; width: min(1240px, calc(100% - 32px)); margin: 0 auto; padding: 46px 0 64px; }
    .view { animation: view-in 250ms ease both; }
    @keyframes view-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 1ms !important; transition-duration: 1ms !important; } }
    .glass {
      background: var(--glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 18px 60px rgba(0,0,0,.16);
    }
    .eyebrow { margin: 0 0 9px; color: var(--gold); font-size: 12px; font-weight: 760; letter-spacing: .15em; text-transform: uppercase; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 12px; font-size: clamp(32px, 5vw, 64px); line-height: .98; letter-spacing: -.045em; }
    .lead { max-width: 690px; margin-bottom: 0; color: var(--muted); font-size: 16px; line-height: 1.65; }
    .topbar { display: flex; justify-content: space-between; align-items: flex-end; gap: 30px; margin-bottom: 32px; }
    .brand-mark { display: grid; place-items: center; flex: 0 0 120px; width: 120px; height: 120px; }
    .brand-mark img { display: block; width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 14px 24px rgba(0,0,0,.28)) drop-shadow(0 0 16px rgba(201,168,76,.16)); }
    .intro { display: flex; align-items: flex-start; gap: 18px; }
    .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
    .stat { padding: 18px 20px; }
    .stat-value { font-size: 28px; font-weight: 780; letter-spacing: -.04em; }
    .stat-label { margin-top: 3px; color: var(--muted); font-size: 12px; }
    .control-panel { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px; margin-bottom: 14px; }
    .filters { display: flex; flex-wrap: wrap; gap: 7px; }
    .filter-btn, .back-btn {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255,255,255,.055);
      padding: 9px 13px;
      cursor: pointer;
      transition: 180ms ease;
    }
    .filter-btn { color: var(--muted); font-size: 12px; }
    .filter-btn:hover, .filter-btn.active, .back-btn:hover { color: var(--text); border-color: rgba(201,168,76,.46); background: rgba(201,168,76,.13); }
    .counter { flex: 0 0 auto; padding: 0 8px; color: var(--muted); font-size: 12px; }
    .legend { display: flex; flex-wrap: wrap; gap: 9px 17px; padding: 0 3px 22px; color: var(--muted); font-size: 12px; }
    .legend-item { display: flex; align-items: center; gap: 7px; }
    .legend-dot { width: 9px; height: 9px; border-radius: 50%; box-shadow: 0 0 14px currentColor; }
    .section-label { margin: 25px 0 10px; }
    .pill { display: inline-flex; align-items: center; gap: 7px; padding: 6px 11px; border: 1px solid rgba(255,255,255,.13); border-radius: 999px; font-size: 11px; font-weight: 760; letter-spacing: .03em; }
    .tier-a { background: rgba(29,158,117,.22); color: #8ee2c5; }
    .tier-b { background: rgba(55,138,221,.22); color: #9acbfa; }
    .tier-c { background: rgba(136,135,128,.22); color: #d5d2c6; }
    .tier-d { background: rgba(239,159,39,.22); color: #ffd08b; }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; }
    .card { position: relative; min-height: 176px; padding: 18px; cursor: pointer; overflow: hidden; transition: 200ms ease; }
    .card::after { content: "→"; position: absolute; right: 17px; bottom: 14px; color: var(--faint); font-size: 18px; transition: 180ms ease; }
    .card:hover { background: var(--glass-hover); border-color: rgba(201,168,76,.4); transform: translateY(-2px); }
    .card:hover::after { color: var(--gold); transform: translateX(3px); }
    .card:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
    .card-top { display: flex; justify-content: space-between; gap: 12px; }
    .card-name { max-width: 78%; font-size: 17px; font-weight: 720; line-height: 1.28; }
    .card-score { color: #f2d77f; font-size: 22px; font-weight: 800; }
    .card-region { margin: 7px 0 10px; color: var(--muted); font-size: 12px; }
    .card-program { padding-right: 18px; color: rgba(255,255,255,.72); font-size: 12px; line-height: 1.5; }
    .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 13px; }
    .tag { padding: 4px 8px; border: 1px solid rgba(255,255,255,.1); border-radius: 999px; background: rgba(255,255,255,.06); color: var(--muted); font-size: 10px; }
    .detail-nav { margin-bottom: 14px; }
    .back-btn { display: inline-flex; align-items: center; gap: 8px; }
    .detail-hero { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 20px; padding: clamp(22px, 4vw, 38px); margin-bottom: 14px; }
    .detail-hero h1 { font-size: clamp(34px, 5vw, 58px); }
    .detail-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; margin-bottom: 14px; color: var(--muted); font-size: 13px; }
    .note { max-width: 760px; margin: 0; color: rgba(255,255,255,.7); line-height: 1.6; }
    .score-block { min-width: 150px; text-align: right; }
    .score-number { color: #f2d77f; font-size: clamp(58px, 8vw, 90px); font-weight: 820; line-height: .84; letter-spacing: -.07em; }
    .score-caption { margin-top: 10px; color: var(--muted); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
    .detail-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 14px; }
    .panel { grid-column: span 6; padding: 22px; }
    .panel.wide { grid-column: 1 / -1; }
    .panel.third { grid-column: span 4; }
    .panel h2 { margin-bottom: 18px; font-size: 15px; letter-spacing: -.01em; }
    .panel h2 span { color: var(--gold); margin-right: 7px; }
    .criteria { display: grid; gap: 13px; }
    .criterion-line { display: grid; grid-template-columns: minmax(110px, 1fr) minmax(120px, 2fr) 28px; align-items: center; gap: 12px; }
    .criterion-name { color: var(--muted); font-size: 12px; }
    .track { height: 4px; overflow: hidden; border-radius: 99px; background: rgba(255,255,255,.1); }
    .fill { height: 100%; border-radius: inherit; background: var(--gold); box-shadow: 0 0 12px rgba(201,168,76,.6); }
    .criterion-score { text-align: right; font-size: 12px; font-weight: 700; }
    .facts { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
    .fact-label { margin-bottom: 4px; color: var(--muted); font-size: 11px; }
    .fact-value { font-size: 13px; line-height: 1.5; }
    .fact-value a { color: #efd478; text-decoration-color: rgba(239,212,120,.4); }
    .route { display: grid; gap: 10px; }
    .route-day { display: grid; grid-template-columns: 62px 1fr; gap: 12px; align-items: start; }
    .day { color: var(--gold); font-size: 11px; font-weight: 760; text-transform: uppercase; }
    .day-text { color: rgba(255,255,255,.75); font-size: 13px; line-height: 1.5; }
    .economics { width: 100%; border-collapse: collapse; font-size: 13px; }
    .economics th, .economics td { padding: 12px 10px; border-bottom: 1px solid rgba(255,255,255,.08); text-align: left; }
    .economics th { color: var(--muted); font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
    .economics td:last-child { font-weight: 730; }
    .months { display: grid; grid-template-columns: repeat(12, minmax(0,1fr)); gap: 7px; }
    .month { display: grid; place-items: center; min-height: 38px; border: 1px solid rgba(255,255,255,.08); border-radius: 10px; background: rgba(0,0,0,.12); color: var(--faint); font-size: 10px; }
    .month.active { border-color: rgba(201,168,76,.32); background: rgba(201,168,76,.26); color: #ffe9a9; box-shadow: inset 0 0 18px rgba(201,168,76,.08); }
    .risks { margin: 0; padding-left: 18px; color: rgba(255,255,255,.72); font-size: 13px; line-height: 1.6; }
    .risks li + li { margin-top: 8px; }
    .status-panel { display: flex; align-items: center; justify-content: space-between; gap: 18px; }
    .status-label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .1em; }
    .status-value { margin-top: 4px; font-size: 18px; font-weight: 760; }
    .status-dot { width: 12px; height: 12px; border-radius: 50%; box-shadow: 0 0 22px currentColor; }
    .ready { color: #77dfba; } .review { color: #8fc8ff; } .paused { color: #ffc16b; }
    .muted { color: var(--muted); }
    .empty { padding: 42px; text-align: center; color: var(--muted); }
    .sort-row { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
    .sort-label { color: var(--muted); font-size: 11px; margin-right: 4px; }
    .month-filter { display: flex; flex-wrap: wrap; gap: 5px; }
    .month-btn { border: 1px solid var(--line); border-radius: 999px; background: rgba(255,255,255,.055); padding: 7px 10px; cursor: pointer; color: var(--muted); font-size: 11px; transition: 180ms ease; }
    .month-btn:hover, .month-btn.active { color: var(--text); border-color: rgba(201,168,76,.46); background: rgba(201,168,76,.13); }
    .compare-bar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 100; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 14px 20px; background: rgba(15,37,69,.95); backdrop-filter: blur(16px); border-top: 1px solid var(--line); transform: translateY(100%); transition: transform 250ms ease; }
    .compare-bar.visible { transform: translateY(0); }
    .compare-bar .chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--glass); font-size: 12px; }
    .compare-bar .chip-x { cursor: pointer; color: var(--muted); font-size: 14px; line-height: 1; }
    .compare-bar .chip-x:hover { color: var(--text); }
    .compare-btn { border: none; border-radius: 999px; background: var(--gold); color: #0f2545; padding: 9px 18px; font-size: 12px; font-weight: 700; cursor: pointer; transition: 180ms ease; }
    .compare-btn:hover { background: #e1c060; }
    .compare-btn:disabled { opacity: .4; cursor: default; }
    .card-check { position: absolute; top: 12px; right: 12px; width: 22px; height: 22px; border: 2px solid var(--faint); border-radius: 6px; background: transparent; cursor: pointer; display: grid; place-items: center; font-size: 12px; transition: 180ms ease; z-index: 2; }
    .card-check.checked { border-color: var(--gold); background: var(--gold); color: #0f2545; }
    .compare-overlay { position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,.7); backdrop-filter: blur(8px); display: grid; place-items: center; animation: view-in 200ms ease; }
    .compare-sheet { width: min(95vw, 1100px); max-height: 90vh; overflow-y: auto; padding: 28px; border-radius: var(--radius); background: rgba(15,37,69,.97); border: 1px solid var(--line); }
    .compare-sheet h2 { margin-bottom: 18px; font-size: 18px; }
    .compare-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .compare-table th, .compare-table td { padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,.08); text-align: left; vertical-align: top; }
    .compare-table th { color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
    .compare-table td:first-child { color: var(--muted); font-size: 11px; width: 140px; }
    .compare-close { position: absolute; top: 16px; right: 20px; background: none; border: none; color: var(--muted); font-size: 22px; cursor: pointer; }
    .compare-close:hover { color: var(--text); }
    @media (max-width: 900px) {
      .grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .panel, .panel.third { grid-column: 1 / -1; }
      .months { grid-template-columns: repeat(6, minmax(0,1fr)); }
    }
    @media (max-width: 620px) {
      .app { width: min(100% - 20px, 1240px); padding-top: 24px; }
      .topbar { align-items: flex-start; }
      .brand-mark { display: grid; flex-basis: 90px; width: 90px; height: 90px; }
      .stats { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .control-panel { align-items: flex-start; flex-direction: column; }
      .grid { grid-template-columns: 1fr; }
      .detail-hero { grid-template-columns: 1fr; }
      .score-block { text-align: left; }
      .score-number { font-size: 64px; }
      .facts { grid-template-columns: 1fr; }
      .criterion-line { grid-template-columns: 100px 1fr 24px; gap: 8px; }
      .months { grid-template-columns: repeat(4, minmax(0,1fr)); }
      .economics { display: block; overflow-x: auto; }
    }
  </style>
</head>

          </header>
          <div class="stats">
            ${stat(filtered.length, "направлений")}${stat(filtered.filter(d => d.tier === "A").length, "к запуску в 2026")}${stat(filtered.filter(d => d.tier === "B").length, "во второй волне")}${stat(avg, "средний балл")}
          </div>
          <div class="control-panel glass"><div class="filters" role="group" aria-label="Фильтр по регионам">${regions.map(region => `<button class="filter-btn ${activeFilter === region ? "active" : ""}" data-region="${region}">${region === "all" ? "Все направления" : region}</button>`).join("")}</div><div class="counter">Показано: ${filtered.length}</div></div>
          <div class="control-panel glass"><div class="filters" role="group" aria-label="Фильтр по тегам">${tagKeys.map(tag => `<button class="filter-btn ${activeTag === tag ? "active" : ""}" data-tag="${tag}">${tag === "all" ? "Все теги" : tagLabels[tag] ?? tag}</button>`).join("")}</div></div>
          <div class="control-panel glass"><span class="sort-label">Сезон:</span><div class="month-filter">${[{v:0,l:"Все"},...monthNames.map((m,i)=>({v:i+1,l:m}))].map(m => `<button class="month-btn ${activeMonth === m.v ? "active" : ""}" data-month="${m.v}">${m.l}</button>`).join("")}</div></div>
          <div class="control-panel glass"><span class="sort-label">Сортировка:</span><div class="sort-row">${Object.entries(sortOptions).map(([k,v]) => `<button class="filter-btn ${activeSort === k ? "active" : ""}" data-sort="${k}">${v}</button>`).join("")}</div></div>

        </section>

      app.querySelectorAll("[data-tag]").forEach(button => button.addEventListener("click", () => { activeTag = button.dataset.tag; renderList(); }));
      app.querySelectorAll("[data-month]").forEach(button => button.addEventListener("click", () => { activeMonth = parseInt(button.dataset.month); renderList(); }));
      app.querySelectorAll("[data-sort]").forEach(button => button.addEventListener("click", () => { activeSort = button.dataset.sort; renderList(); }));
      app.querySelectorAll("[data-destination]").forEach(card => {
        const open = () => showDetail(card.dataset.destination);
        card.addEventListener("click", e => { if (e.target.closest(".card-check")) return; open(); });
        card.addEventListener("keydown", event => { if (event.key === "Enter" || event.key === " ") { event.preventDefault(); open(); } });
      });
      app.querySelectorAll(".card-check").forEach(cb => cb.addEventListener("click", e => {
        e.stopPropagation();
        const id = cb.dataset.compare;
        if (compareSet.has(id)) compareSet.delete(id);
        else if (compareSet.size < 3) compareSet.add(id);
        renderList();
      }));
      document.querySelectorAll("[data-remove]").forEach(x => x.addEventListener("click", () => { compareSet.delete(x.dataset.remove); renderList(); }));

      if (goBtn) goBtn.addEventListener("click", () => { if (compareSet.size >= 2) showCompare(); });

    function stat(value, label) { return `<div class="stat glass"><div class="stat-value">${value}</div><div class="stat-label">${label}</div></div>`; }
    function sortItems(items) {
      const arr = [...items];
      switch (activeSort) {
        case "price": return arr.sort((a,b) => parseNum(money(a).cost) - parseNum(money(b).cost));
        case "margin": return arr.sort((a,b) => parseNum(money(b).margin) - parseNum(money(a).margin));
        case "alpha": return arr.sort((a,b) => a.name.localeCompare(b.name, "ru"));
        default: return arr.sort((a,b) => b.score - a.score);
      }
    }
    function renderBoard(items) {
      if (!items.length) return `<div class="empty glass">Направлений по этим фильтрам не найдено.</div>`;
      if (activeSort !== "score") {
        const sorted = sortItems(items);
        return `<div class="grid">${sorted.map(cardMarkup).join("")}</div>`;
      }
      return ["A","B","C","D"].map(tier => {
        const group = sortItems(items.filter(d => d.tier === tier));
        if (!group.length) return "";
        return `<section><div class="section-label"><span class="pill ${tiers[tier].className}">${tiers[tier].label}</span></div><div class="grid">${group.map(cardMarkup).join("")}</div></section>`;
      }).join("");
    }
    function cardMarkup(d) {
      const checked = compareSet.has(d.id);
      return `<article class="card glass" role="button" tabindex="0" data-destination="${d.id}" aria-label="Открыть ${d.name}"><div class="card-check ${checked ? "checked" : ""}" data-compare="${d.id}" title="Сравнить">${checked ? "✓" : ""}</div><div class="card-top"><div class="card-name">${d.name}</div><div class="card-score">${d.score.toFixed(2)}</div></div><div class="card-region">${d.region}</div><div class="card-program">${d.program}</div><div class="tags">${d.tags.map(tag => `<span class="tag">${tagLabels[tag] ?? tag}</span>`).join("")}</div></article>`;
    }

    function showDetail(id, pushState = true) {
      const d = destinations.find(item => item.id === id);
      if (!d) return renderList();
      if (pushState) history.pushState({ destination: id }, "", `#${id}`);
      document.title = `${d.name} — Turon Tour`;
      const criteria = safeCriteria(d);
      const visa = d.visa ?? {};
      const aviation = d.aviation ?? {};
      const economics = money(d);
      const activeMonths = d.seasons ?? [];
      app.innerHTML = `
        <article class="view">
          <nav class="detail-nav"><button class="back-btn glass" id="backButton" type="button">← Назад к направлениям</button></nav>
          <header class="detail-hero glass">
            <div><p class="eyebrow">Карточка направления</p><div class="detail-meta"><span>${d.region}</span><span>·</span><span class="pill ${tiers[d.tier].className}">${tiers[d.tier].label}</span></div><h1>${d.name}</h1><p class="note">${valueOrPending(d.note)}</p></div>
            <div class="score-block"><div class="score-number">${d.score.toFixed(2)}</div><div class="score-caption">итоговый скор · из 5</div></div>
          </header>
          <div class="detail-grid">
            <section class="panel glass"><h2><span>01</span> Критерии</h2><div class="criteria">${Object.entries(criteria).map(([name, value]) => criterionMarkup(name, value)).join("")}</div></section>
            <section class="panel glass"><h2><span>02</span> Виза и авиа</h2><div class="facts">${fact("Статус визы", valueOrPending(visa.status))}${fact("Срок / пребывание", valueOrPending(visa.term))}${fact("Стоимость визы", valueOrPending(visa.cost))}${fact("Официальная ссылка", visa.url ? `<a href="${visa.url}" target="_blank" rel="noopener">Открыть источник ↗</a>` : "уточняется")}${fact("Перевозчики", valueOrPending(aviation.carriers))}${fact("Частота", valueOrPending(aviation.frequency))}${fact("Билет туда-обратно", valueOrPending(aviation.price))}</div></section>
            <section class="panel glass"><h2><span>03</span> Программа</h2><div class="route">${fallbackRoute(d).map((row, i) => { const parts = row.split("·"); return `<div class="route-day"><span class="day">${parts.length > 1 ? parts.shift() : `Этап ${i+1}`}</span><span class="day-text">${parts.join("·") || row}</span></div>`; }).join("")}</div></section>
            <section class="panel glass"><h2><span>04</span> Экономика</h2><table class="economics"><thead><tr><th>Показатель</th><th>Значение</th></tr></thead><tbody><tr><td>Себестоимость / чел.</td><td>${economics.cost}</td></tr><tr><td>Цена продажи / чел.</td><td>${economics.price}</td></tr><tr><td>Валовая маржа</td><td>${economics.margin}</td></tr><tr><td>Точка безубыточности</td><td>${economics.breakeven}</td></tr></tbody></table></section>
            <section class="panel wide glass"><h2><span>05</span> Сезонный календарь</h2><div class="months">${monthNames.map((month, index) => `<div class="month ${activeMonths.includes(index+1) ? "active" : ""}" title="${activeMonths.length ? (activeMonths.includes(index+1) ? "Рабочий месяц" : "Вне сезона") : "Сезон уточняется"}">${month}</div>`).join("")}</div>${activeMonths.length ? "" : `<p class="muted" style="font-size:12px;margin:12px 0 0">Рабочие месяцы уточняются</p>`}</section>
            <section class="panel wide glass"><h2><span>06</span> Риски</h2><ul class="risks">${fallbackRisks(d).slice(0,4).map(risk => `<li>${risk}</li>`).join("")}</ul></section>
            <footer class="panel wide glass status-panel"><div><div class="status-label">Статус продукта</div><div class="status-value ${d.status ?? "review"}">${statusLabels[d.status] ?? statusLabels.review}</div></div><i class="status-dot ${d.status ?? "review"}" aria-hidden="true"></i></footer>
          </div>
        </article>`;
      document.getElementById("backButton").addEventListener("click", () => history.back());
      window.scrollTo({ top: 0, behavior: "instant" });
    }

    function criterionMarkup(name, value) {
      const score = typeof value === "number" ? Math.max(0, Math.min(5, value)) : 0;
      return `<div class="criterion-line"><span class="criterion-name">${name}</span><div class="track"><div class="fill" style="width:${score * 20}%"></div></div><span class="criterion-score">${typeof value === "number" ? value.toFixed(1) : "—"}</span></div>`;
    }
    function fact(label, value) { return `<div><div class="fact-label">${label}</div><div class="fact-value">${value}</div></div>`; }

    function showCompare() {
      const items = [...compareSet].map(id => destinations.find(d => d.id === id)).filter(Boolean);
      if (items.length < 2) return;
      const rows = [
        ["Регион", d => d.region],
        ["Тир", d => tiers[d.tier].label],
        ["Скор", d => d.score.toFixed(2)],
        ["Программа", d => d.program],
        ["Виза", d => d.visa?.status ?? "—"],
        ["Стоимость визы", d => d.visa?.cost ?? "—"],
        ["Перевозчики", d => d.aviation?.carriers ?? "—"],
        ["Билет RT", d => d.aviation?.price ?? "—"],
        ["Себестоимость", d => money(d).cost],
        ["Цена продажи", d => money(d).price],
        ["Маржа", d => money(d).margin],
        ["Безубыточность", d => money(d).breakeven],
        ["Сезон", d => (d.seasons ?? []).map(m => monthNames[m-1]).join(", ") || "—"],
        ["Статус", d => statusLabels[d.status] ?? "—"],
        ...criterionNames.map(c => [c, d => d.criteria?.[c]?.toFixed(1) ?? "—"])
      ];
      const overlay = document.createElement("div");
      overlay.className = "compare-overlay";
      overlay.innerHTML = `<div class="compare-sheet" style="position:relative"><button class="compare-close" id="closeCompare">✕</button><h2>Сравнение направлений</h2><table class="compare-table"><thead><tr><th></th>${items.map(d => `<th>${d.name}</th>`).join("")}</tr></thead><tbody>${rows.map(([label, fn]) => `<tr><td>${label}</td>${items.map(d => `<td>${fn(d)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
      document.body.appendChild(overlay);
      overlay.addEventListener("click", e => { if (e.target === overlay || e.target.id === "closeCompare") overlay.remove(); });
    }

    window.addEventListener("popstate", event => event.state?.destination ? showDetail(event.state.destination, false) : renderList());
    const initialId = location.hash.replace("#", "");
    if (destinations.some(d => d.id === initialId)) {
      history.replaceState({ destination: initialId }, "", `#${initialId}`);
      showDetail(initialId, false);
    } else {
      history.replaceState({}, "", location.pathname);
      renderList();
    }
  </script>
</body>
</html>
