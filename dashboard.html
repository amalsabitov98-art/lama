const MANAGERS  = ['Муслим','Абдулкарим','Сарвинос','Азиза'];
const DIRECTIONS= ['Дубай','Турция','Египет','Европа','Таиланд'];
const MRATES    = {Дубай:.15,Турция:.12,Египет:.14,Европа:.18,Таиланд:.16};
const FUNNEL_STAGES = ['Новый лид','Требует контакта','Проинформирован','Визит в офис','Оплачено'];
const EXTRA_STAGES  = ['Отложенные','Нецелевой'];
const ALL_STAGES    = [...FUNNEL_STAGES,...EXTRA_STAGES];

function makeRng(seed){
  let s=seed>>>0;
  return ()=>{ s^=s<<13;s^=s>>17;s^=s<<5;return(s>>>0)/4294967296; };
}
function wChoice(rng,w){ let c=0,r=rng(); for(let i=0;i<w.length;i++){c+=w[i];if(r<c)return i;} return w.length-1; }

function genDeals(){
  const rng=makeRng(31337);
  const clients=['Алишер Т.','Нилуфар К.','Бобур М.','Гулнора Р.','Санжар Х.',
    'Диля А.','Отабек Ю.','Малика С.','Феруз Н.','Зиёда К.',
    'Рустам Б.','Лола Ш.','Жамшид В.','Насиба О.','Камол Т.',
    'Умида Р.','Шохрух А.','Барно И.','Дилшод Н.','Мадина Х.'];
  const mW=[.32,.25,.23,.20];
  const dW=[.28,.26,.19,.14,.13];
  const aW=[.22,.20,.24,.18,.10,.06];
  const months=[
    {y:2026,m:0,n:23,pp:.88,gb:3e6,gr:16e6},
    {y:2026,m:1,n:18,pp:.85,gb:2.5e6,gr:14e6},
    {y:2026,m:2,n:25,pp:.88,gb:3.5e6,gr:18e6},
    {y:2026,m:3,n:28,pp:.90,gb:4e6,gr:20e6},
    {y:2026,m:4,n:24,pp:.87,gb:3e6,gr:18e6},
    {y:2026,m:5,n:14,pp:.36,gb:2.5e6,gr:15e6},
  ];
  const deals=[];let id=1;
  for(const cfg of months){
    const {y,m,n,pp,gb,gr}=cfg;
    const maxD=(m===5)?11:new Date(y,m+1,0).getDate();
    for(let i=0;i<n;i++){
      const isPaid=rng()<pp;
      const day=Math.floor(rng()*maxD)+1;
      const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      const mgr=MANAGERS[wChoice(rng,mW)];
      const dir=DIRECTIONS[wChoice(rng,dW)];
      const stage=isPaid?'Оплачено':ALL_STAGES[wChoice(rng,aW)];
      const raw=gb+rng()*gr;
      const gross=Math.round(raw/500000)*500000;
      const mr=MRATES[dir];
      const net=Math.round(gross*(1-mr)/100000)*100000;
      const margin=gross-net;
      let paid=0;
      if(stage==='Оплачено'){
        paid=rng()<.88?gross:Math.round(gross*(0.5+rng()*0.4)/500000)*500000;
      } else if((stage==='Визит в офис'||stage==='Проинформирован')&&rng()<.25){
        paid=Math.round(gross*0.3/500000)*500000;
      }
      const fd=new Date(y,m,day+7+Math.floor(rng()*60));
      deals.push({
        id:`TUR-${String(id).padStart(3,'0')}`,date:ds,manager:mgr,
        client:clients[Math.floor(rng()*clients.length)],direction:dir,stage,
        gross,net,margin,marginPct:parseFloat((margin/gross*100).toFixed(1)),
        paid,balance:gross-paid,
        flightDate:fd.toISOString().slice(0,10),
        month:`${y}-${String(m+1).padStart(2,'0')}`,
        quarter:`Q${Math.ceil((m+1)/3)}`,year:y,
      });id++;
    }
  }
  return deals.sort((a,b)=>a.date.localeCompare(b.date));
}
const DEMO_DEALS=genDeals();

function TODAY(){ return new Date('2026-06-11'); }
function fmt(val,cur='UZS',rate=12700){
  const v=cur==='USD'?val/rate:val;
  const pfx=cur==='USD'?'$':'';
  const sfx=cur==='USD'?'':' сум';
  const av=Math.abs(v);
  if(av>=1e9) return pfx+(v/1e9).toFixed(1)+(cur==='USD'?' B':' млрд');
  if(av>=1e6) return pfx+(v/1e6).toFixed(1)+(cur==='USD'?' M':' млн');
  if(av>=1e3) return pfx+(v/1e3).toFixed(0)+(cur==='USD'?' K':' тыс');
  return pfx+Math.round(v)+sfx;
}
function fmtFull(val,cur='UZS',rate=12700){
  const v=cur==='USD'?val/rate:val;
  if(cur==='USD') return '$'+v.toLocaleString('ru-RU',{maximumFractionDigits:0});
  return v.toLocaleString('ru-RU',{maximumFractionDigits:0})+' сум';
}
function fmtPct(v){ return `${parseFloat(v).toFixed(1)}%`; }
function getMonthRange(offset=0){
  const d=TODAY();
  const start=new Date(d.getFullYear(),d.getMonth()+offset,1);
  const end=new Date(d.getFullYear(),d.getMonth()+offset+1,0);
  return{
    start:start.toISOString().slice(0,10),
    end:end.toISOString().slice(0,10),
    label:start.toLocaleDateString('ru-RU',{month:'long',year:'numeric'}),
  };
}
function getQuarterRange(offset=0){
  const d=TODAY();
  const q=Math.ceil((d.getMonth()+1)/3)+offset;
  const year=d.getFullYear()+Math.floor((q-1)/4);
  const qn=((q-1)%4+4)%4+1;
  const start=new Date(year,(qn-1)*3,1);
  const end=new Date(year,qn*3,0);
  return{start:start.toISOString().slice(0,10),end:end.toISOString().slice(0,10),label:`Q${qn} ${year}`};
}
function filterD(deals,start,end){ return deals.filter(d=>d.date>=start&&d.date<=end); }
function daysSince(dateStr){ return Math.floor((TODAY()-new Date(dateStr))/86400000); }
function calcStats(deals){
  const gross=deals.reduce((s,d)=>s+d.gross,0);
  const net=deals.reduce((s,d)=>s+d.net,0);
  const margin=deals.reduce((s,d)=>s+d.margin,0);
  const count=deals.length;
  return{ gross,net,margin,count,
    avgCheck:count?gross/count:0,
    avgMargin:count?margin/count:0,
    marginPct:gross?margin/gross*100:0 };
}
function trendPct(a,b){ return b>0?(a-b)/b*100:0; }

    {top:'-15%',left:'-8%',  w:700,h:700,color:'rgba(124,58,237,0.18)'},  // violet TL
    {top:'5%',  right:'-5%', w:600,h:600,color:'rgba(6,182,212,0.16)'},   // cyan TR

    {bottom:'10%',right:'5%',w:450,h:450,color:'rgba(59,130,246,0.13)'}, // blue BR
  ];
  return(
    <div style={{position:'fixed',inset:0,overflow:'hidden',zIndex:0,pointerEvents:'none'}}>
      {blobs.map((b,i)=>(
        <div key={i} style={{
          position:'absolute',

          background:`radial-gradient(circle, ${b.color}, transparent 70%)`,

        }}/>
      ))}

}

function Card({children,style}){
  const [h,setH]=useState(false);
  return(
    <div
      onMouseEnter={()=>setH(true)}
      onMouseLeave={()=>setH(false)}
      style={{
        background:C.glass,
        backdropFilter:'blur(40px)',
        WebkitBackdropFilter:'blur(40px)',
        borderRadius:24,
        border:`1px solid ${C.border}`,
        boxShadow:h?C.shadowH:C.shadow,
        padding:24,
        transition:'box-shadow .25s ease, transform .25s ease',
        transform:h?'translateY(-1px)':'none',
        position:'relative',
        zIndex:1,
        ...style,
      }}>
      {children}

}

  const [goal,setGoal]=useState(100000000);

    return{start:customStart,end:customEnd,label:`${customStart} — ${customEnd}`};
  },[period,customStart,customEnd]);

  const deals=useMemo(()=>filterD(DEMO_DEALS,range.start,range.end),[range]);
  const paid=deals.filter(d=>d.stage==='Оплачено');
  const active=deals.filter(d=>!['Оплачено','Нецелевой'].includes(d.stage));
  const qual=deals.filter(d=>d.stage!=='Нецелевой');

  const totalGross=paid.reduce((s,d)=>s+d.gross,0);
  const conv=qual.length?paid.length/qual.length*100:0;
  const progress=Math.min(totalGross/goal*100,100);

  const mgrStats=useMemo(()=>MANAGERS.map(mgr=>{
    const md=deals.filter(d=>d.manager===mgr);
    const mp=md.filter(d=>d.stage==='Оплачено');
    const mq=md.filter(d=>d.stage!=='Нецелевой');
    const gross=mp.reduce((s,d)=>s+d.gross,0);
    return{mgr,all:md.length,paid:mp.length,gross,
      conv:mq.length?mp.length/mq.length*100:0,
      avg:mp.length?gross/mp.length:0};
  }).sort((a,b)=>b.gross-a.gross),[deals]);

  const leader=mgrStats[0];
  const lagger=mgrStats[mgrStats.length-1];

  const funnelData=FUNNEL_STAGES.map(s=>({s,n:deals.filter(d=>d.stage===s).length}));
  const extraData=EXTRA_STAGES.map(s=>({s,n:deals.filter(d=>d.stage===s).length}));
  const fMax=funnelData[0]?.n||1;

  const dailyData=useMemo(()=>{
    const map={};
    paid.forEach(d=>{map[d.date]=(map[d.date]||0)+d.gross;});
    return Object.entries(map).sort().map(([date,gross])=>({date:date.slice(5),gross}));
  },[paid]);

  return(
    <div style={{padding:'0 28px 56px',maxWidth:1440,margin:'0 auto',position:'relative',zIndex:1}}
      className="fade-in">

      {/* Controls bar */}
      <div style={{display:'flex',gap:12,alignItems:'center',marginBottom:24,flexWrap:'wrap'}}>
        <SegControl value={period} onChange={setPeriod} options={[
          {v:'current',l:'Этот месяц'},{v:'prev',l:'Прошлый'},{v:'custom',l:'Произвольный'}
        ]}/>
        {period==='custom'&&(
          <div style={{display:'flex',gap:6,alignItems:'center'}}>
            {[{v:customStart,fn:setCS},{v:customEnd,fn:setCE}].map((f,i)=>(
              <input key={i} type="date" value={f.v} onChange={e=>f.fn(e.target.value)}
                style={{background:C.glassSolid,border:`1px solid ${C.borderD}`,borderRadius:10,
                  color:C.text,padding:'6px 11px',fontSize:13,outline:'none',
                  fontFamily:"'Plus Jakarta Sans',sans-serif",
                  boxShadow:C.shadowSm}}/>
            ))}
          </div>
        )}
        <span style={{fontSize:12,color:C.textM,fontStyle:'italic'}}>{range.label}</span>
        <div style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:8}}>
          <span style={{fontSize:12,color:C.textS,fontWeight:500}}>Цель месяца</span>
          {goalEdit?(
            <input autoFocus value={goalInput} onChange={e=>setGI(e.target.value)}
              onBlur={()=>{setGoal(+goalInput||goal);setGE(false);}}
              onKeyDown={e=>{if(e.key==='Enter'){setGoal(+goalInput||goal);setGE(false);}}}
              style={{width:160,padding:'6px 12px',borderRadius:10,
                background:C.glassSolid,border:`1.5px solid ${C.gold}`,
                color:C.text,fontSize:13,outline:'none',
                fontFamily:"'Plus Jakarta Sans',sans-serif",
                boxShadow:`0 0 0 3px ${C.goldBg}`}}/>
          ):(
            <button onClick={()=>{setGI(String(goal));setGE(true);}}
              style={{display:'flex',alignItems:'center',gap:6,padding:'6px 14px',borderRadius:10,
                border:`1px solid ${C.borderD}`,background:C.glassSolid,color:C.text,
                cursor:'pointer',fontSize:13,fontWeight:600,
                fontFamily:"'Plus Jakarta Sans',sans-serif",
                boxShadow:C.shadowSm}}>
              {fmt(goal,currency,rate)}
              <Ic n="pencil" s={12} c={C.textM}/>
            </button>
          )}
        </div>
      </div>

      {/* BENTO GRID */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(12,1fr)',gap:16}}>

        {/* ── Revenue card (7 cols) ── */}
        <Card style={{gridColumn:'span 7'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:12}}>
            <span style={{fontSize:10,fontWeight:700,color:C.textM,
              textTransform:'uppercase',letterSpacing:'.1em'}}>
              Выручка за период
            </span>
            <Pill color={C.gold} bg={C.goldBg}>
              {progress.toFixed(0)}% от цели
            </Pill>
          </div>
          <div style={{fontSize:48,fontWeight:800,color:C.gold,letterSpacing:'-.03em',
            lineHeight:1,marginBottom:4}}>
            {fmt(totalGross,currency,rate)}
          </div>
          <div style={{fontSize:13,color:C.textS,fontWeight:500,marginBottom:20}}>
            {fmtFull(totalGross,currency,rate)}
          </div>
          {/* Progress bar */}
          <div style={{background:'rgba(15,23,42,0.06)',borderRadius:8,height:8,overflow:'hidden'}}>
            <div style={{
              width:`${progress}%`,height:'100%',borderRadius:8,
              background:`linear-gradient(90deg,${C.blue},${C.gold})`,
              boxShadow:`0 0 12px ${C.goldBg}`,
              transition:'width .7s cubic-bezier(.16,1,.3,1)',
            }}/>
          </div>
          <div style={{display:'flex',justifyContent:'space-between',marginTop:8,fontSize:11,color:C.textM,fontWeight:500}}>
            <span>0</span>
            <span>Цель: {fmt(goal,currency,rate)}</span>
          </div>
        </Card>

        {/* ── Right KPI stack (5 cols) ── */}
        <div style={{gridColumn:'span 5',display:'flex',flexDirection:'column',gap:16}}>

          {/* Active leads */}
          <Card style={{flex:1}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
              <div>
                <div style={{fontSize:10,fontWeight:700,color:C.textM,textTransform:'uppercase',
                  letterSpacing:'.1em',marginBottom:8}}>Активные лиды</div>
                <div style={{fontSize:32,fontWeight:800,color:C.yellow,letterSpacing:'-.02em',lineHeight:1}}>
                  {active.length}
                </div>
                <div style={{fontSize:12,color:C.textM,fontWeight:500,marginTop:3}}>
                  сделок в обработке
                </div>
              </div>
              <div style={{width:44,height:44,borderRadius:14,background:C.yellowBg,
                display:'flex',alignItems:'center',justifyContent:'center'}}>
                <Ic n="timer" s={20} c={C.yellow}/>
              </div>
            </div>
          </Card>

          {/* Conversion */}
          <Card style={{flex:1}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
              <div>
                <div style={{fontSize:10,fontWeight:700,color:C.textM,textTransform:'uppercase',
                  letterSpacing:'.1em',marginBottom:8}}>Конверсия отдела</div>
                <div style={{fontSize:32,fontWeight:800,letterSpacing:'-.02em',lineHeight:1,
                  color:conv>=55?C.green:C.yellow}}>
                  {fmtPct(conv)}
                </div>
                <div style={{fontSize:12,color:C.textM,fontWeight:500,marginTop:3}}>
                  {paid.length} из {qual.length} сделок
                </div>
              </div>
              <div style={{width:44,height:44,borderRadius:14,
                background:conv>=55?C.greenBg:C.yellowBg,
                display:'flex',alignItems:'center',justifyContent:'center'}}>
                <Ic n="target" s={20} c={conv>=55?C.green:C.yellow}/>
              </div>
            </div>
          </Card>

          {/* Leader / Lagger */}
          <Card style={{flex:1}}>
            <div style={{fontSize:10,fontWeight:700,color:C.textM,textTransform:'uppercase',
              letterSpacing:'.1em',marginBottom:10}}>Лидер / Отстающий</div>
            <div style={{display:'flex',flexDirection:'column',gap:8}}>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',
                padding:'8px 12px',borderRadius:12,background:C.greenBg,
                border:`1px solid rgba(5,150,105,0.15)`}}>
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  <div style={{width:28,height:28,borderRadius:10,background:C.green,
                    display:'flex',alignItems:'center',justifyContent:'center'}}>
                    <Ic n="trophy" s={13} c="#fff"/>
                  </div>
                  <div>
                    <div style={{fontWeight:700,fontSize:13,color:C.text}}>{leader?.mgr}</div>
                    <div style={{fontSize:11,color:C.textS}}>{fmt(leader?.gross||0,currency,rate)}</div>
                  </div>
                </div>
                <Pill color={C.green} bg="rgba(5,150,105,0.15)">Лидер</Pill>
              </div>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',
                padding:'8px 12px',borderRadius:12,background:C.redBg,
                border:`1px solid rgba(220,38,38,0.15)`}}>
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  <div style={{width:28,height:28,borderRadius:10,background:C.red,
                    display:'flex',alignItems:'center',justifyContent:'center'}}>
                    <Ic n="trendDn" s={13} c="#fff"/>
                  </div>
                  <div>
                    <div style={{fontWeight:700,fontSize:13,color:C.text}}>{lagger?.mgr}</div>
                    <div style={{fontSize:11,color:C.textS}}>{fmt(lagger?.gross||0,currency,rate)}</div>
                  </div>
                </div>
                <Pill color={C.red} bg="rgba(220,38,38,0.15)">Отстаёт</Pill>
              </div>
            </div>
          </Card>
        </div>

        {/* ── Funnel (5 cols) ── */}
        <Card style={{gridColumn:'span 5'}}>
          <SecTitle icon="barChart">Воронка продаж</SecTitle>
          <div style={{display:'flex',flexDirection:'column',gap:5}}>
            {funnelData.map((item,idx)=>{
              const next=funnelData[idx+1]?.n;
              const c2n=item.n&&next!=null?next/item.n*100:null;
              const w=Math.max(item.n/fMax*100,item.n?5:0);
              const col=FUNNEL_COLORS[idx];
              return(
                <div key={item.s}>
                  <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:2}}>
                    <div style={{width:140,fontSize:12,color:C.textS,flexShrink:0,
                      fontWeight:500,display:'flex',alignItems:'center',gap:6}}>
                      {item.s==='Оплачено'&&(
                        <div style={{width:7,height:7,borderRadius:2,background:C.green,flexShrink:0}}/>
                      )}
                      {item.s}
                    </div>
                    <div style={{flex:1,background:'rgba(15,23,42,0.05)',borderRadius:8,
                      height:24,overflow:'hidden'}}>
                      <div style={{
                        width:`${w}%`,height:'100%',borderRadius:8,
                        background:col,minWidth:item.n?24:0,
                        display:'flex',alignItems:'center',justifyContent:'flex-end',
                        paddingRight:8,fontSize:12,fontWeight:700,color:'#fff',
                        transition:'width .6s cubic-bezier(.16,1,.3,1)',
                        boxShadow:`0 2px 8px ${col}44`,
                      }}>
                        {item.n>0?item.n:''}
                      </div>
                    </div>
                    <div style={{width:26,fontSize:13,fontWeight:700,color:C.textS,textAlign:'right'}}>
                      {item.n}
                    </div>
                  </div>
                  {c2n!=null&&(
                    <div style={{fontSize:10,color:C.textM,paddingLeft:150,marginBottom:3,fontWeight:500}}>
                      ↓ {c2n.toFixed(0)}% переход
                    </div>
                  )}
                </div>
              );
            })}
            <div style={{marginTop:10,paddingTop:10,borderTop:`1px solid ${C.borderD}`,
              display:'flex',gap:16}}>
              {extraData.map(e=>(
                <div key={e.s} style={{display:'flex',alignItems:'center',gap:6}}>
                  <div style={{width:7,height:7,borderRadius:2,background:C.textM}}/>
                  <span style={{fontSize:11,color:C.textM,fontWeight:500}}>{e.s}: {e.n}</span>
                </div>
              ))}
            </div>
          </div>
        </Card>

        {/* ── Manager ratings (7 cols) ── */}
        <Card style={{gridColumn:'span 7'}}>
          <SecTitle icon="users">Рейтинг менеджеров</SecTitle>
          <div style={{display:'flex',flexDirection:'column',gap:10}}>
            {mgrStats.map((m,i)=>{
              const avatarColors=[C.gold,C.blue,C.purple,'#64748B'];
              const avatarBg=[C.goldBg,C.blueBg,C.purpleBg,'rgba(100,116,139,0.1)'];
              return(
                <div key={m.mgr} style={{
                  display:'flex',alignItems:'center',gap:14,
                  padding:'12px 16px',borderRadius:16,
                  background:i===0?C.goldBg:'rgba(15,23,42,0.02)',
                  border:`1px solid ${i===0?C.goldBorder:'rgba(15,23,42,0.05)'}`,
                  transition:'background .15s',
                }}>
                  <div style={{
                    width:36,height:36,borderRadius:12,flexShrink:0,
                    background:avatarBg[i],border:`1.5px solid ${avatarColors[i]}44`,
                    display:'flex',alignItems:'center',justifyContent:'center',
                    fontSize:15,fontWeight:800,color:avatarColors[i],
                  }}>
                    {i+1}
                  </div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontWeight:700,fontSize:14,color:C.text,marginBottom:2}}>{m.mgr}</div>
                    <div style={{fontSize:11,color:C.textM,fontWeight:500}}>
                      {m.paid} сделок · конверсия {m.conv.toFixed(0)}%
                    </div>
                  </div>
                  <div style={{textAlign:'right',flexShrink:0}}>
                    <div style={{fontWeight:800,color:i===0?C.gold:C.text,fontSize:16,
                      letterSpacing:'-.02em'}}>
                      {fmt(m.gross,currency,rate)}
                    </div>
                    <div style={{fontSize:11,color:C.textM,fontWeight:500}}>
                      ср. чек {fmt(m.avg,currency,rate)}
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </Card>

        {/* ── Daily chart (12 cols) ── */}
        <Card style={{gridColumn:'span 12'}}>
          <SecTitle icon="trendUp">Динамика выручки (оплаченные сделки)</SecTitle>
          {dailyData.length>0?(
            <ResponsiveContainer width="100%" height={220}>
              <AreaChart data={dailyData} margin={{top:8,right:16,left:0,bottom:0}}>
                <defs>
                  <linearGradient id="goldAreaFill" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%"  stopColor={C.gold} stopOpacity={0.18}/>
                    <stop offset="100%" stopColor={C.gold} stopOpacity={0}/>
                  </linearGradient>
                </defs>
                <CartesianGrid stroke="rgba(15,23,42,0.05)" strokeDasharray="0" vertical={false}/>
                <XAxis dataKey="date" {...AXIS_STYLE}/>
                <YAxis tickFormatter={v=>fmt(v,currency,rate)} {...AXIS_STYLE} width={72}/>
                <Tooltip {...CHART_TOOLTIP}
                  formatter={v=>[fmtFull(v,currency,rate),'Выручка']}/>
                <Area type="monotone" dataKey="gross" stroke={C.gold} strokeWidth={2.5}
                  fill="url(#goldAreaFill)" dot={false}
                  activeDot={{r:5,fill:C.gold,strokeWidth:0,
                    style:{filter:`drop-shadow(0 0 6px ${C.gold}88)`}}}/>
              </AreaChart>
            </ResponsiveContainer>
          ):(
            <div style={{height:220,display:'flex',alignItems:'center',justifyContent:'center',
              color:C.textM,fontSize:13}}>
              Нет оплаченных сделок за период
            </div>
          )}
        </Card>

      </div>{/* end bento grid */}
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// TAB 2 — АНАЛИТИКА
// ─────────────────────────────────────────────────────────────
const MONTHS=['2026-01','2026-02','2026-03','2026-04','2026-05','2026-06'];
const MONTH_LABELS={'2026-01':'Янв','2026-02':'Фев','2026-03':'Мар',
  '2026-04':'Апр','2026-05':'Май','2026-06':'Июн'};

function Tab2({currency,rate}){
  const [period,setPeriod]=useState('month');

  const CLOSED=useMemo(()=>DEMO_DEALS.filter(d=>d.stage==='Оплачено'),[]);

  const {cRange,pRange}=useMemo(()=>{
    if(period==='month') return{cRange:getMonthRange(0),pRange:getMonthRange(-1)};
    if(period==='q') return{cRange:getQuarterRange(0),pRange:getQuarterRange(-1)};
    const y=TODAY().getFullYear();
    return{
      cRange:{start:`${y}-01-01`,end:`${y}-12-31`,label:`${y} год`},
      pRange:{start:`${y-1}-01-01`,end:`${y-1}-12-31`,label:`${y-1} год`}
    };
  },[period]);

  const curr=useMemo(()=>calcStats(filterD(CLOSED,cRange.start,cRange.end)),[CLOSED,cRange]);
  const prev=useMemo(()=>calcStats(filterD(CLOSED,pRange.start,pRange.end)),[CLOSED,pRange]);

  const allClosed=CLOSED;

  const recv=useMemo(()=>DEMO_DEALS.filter(d=>d.balance>0&&d.paid>0)
    .sort((a,b)=>b.balance-a.balance),[]);
  const totalDebt=recv.reduce((s,d)=>s+d.balance,0);

  const dirStats=useMemo(()=>DIRECTIONS.map(dir=>{
    const cd=filterD(CLOSED,cRange.start,cRange.end).filter(d=>d.direction===dir);
    const ad=allClosed.filter(d=>d.direction===dir);
    const cg=cd.reduce((s,d)=>s+d.gross,0);
    const cm=cd.reduce((s,d)=>s+d.margin,0);
    const ag=ad.reduce((s,d)=>s+d.gross,0);
    const am=ad.reduce((s,d)=>s+d.margin,0);
    return{dir,gross:cg,margin:cm,marginPct:cg?cm/cg*100:0,
      allGross:ag,allMargin:am,allPct:ag?am/ag*100:0};
  }).sort((a,b)=>b.allPct-a.allPct),[CLOSED,cRange,allClosed]);

  const bestDir=dirStats[0];

  const mgrStats=useMemo(()=>MANAGERS.map(mgr=>{
    const cd=filterD(CLOSED,cRange.start,cRange.end).filter(d=>d.manager===mgr);
    const g=cd.reduce((s,d)=>s+d.gross,0);
    const n=cd.reduce((s,d)=>s+d.net,0);
    const m=cd.reduce((s,d)=>s+d.margin,0);
    const cnt=cd.length;
    const monthly=MONTHS.map(mo=>{
      const md=allClosed.filter(d=>d.manager===mgr&&d.month===mo);
      return{month:MONTH_LABELS[mo],margin:md.reduce((s,d)=>s+d.margin,0)};
    });
    return{mgr,gross:g,net:n,margin:m,marginPct:g?m/g*100:0,
      count:cnt,avgCheck:cnt?g/cnt:0,monthly};
  }).sort((a,b)=>b.margin-a.margin),[CLOSED,cRange,allClosed]);

  const bestMgr=mgrStats[0];

  const monthlyChart=MONTHS.map(mo=>{
    const md=allClosed.filter(d=>d.month===mo);
    return{month:MONTH_LABELS[mo],
      gross:md.reduce((s,d)=>s+d.gross,0),
      net:md.reduce((s,d)=>s+d.net,0),
      margin:md.reduce((s,d)=>s+d.margin,0)};
  });

  const bestMonth=[...monthlyChart].sort((a,b)=>b.margin-a.margin)[0];
  const hasEnoughData=monthlyChart.filter(m=>m.gross>0).length>=3;

  return(
    <div style={{padding:'0 28px 56px',maxWidth:1440,margin:'0 auto',position:'relative',zIndex:1}}
      className="fade-in">

      {/* Controls */}
      <div style={{display:'flex',gap:12,alignItems:'center',marginBottom:24,flexWrap:'wrap'}}>
        <SegControl value={period} onChange={setPeriod} options={[
          {v:'month',l:'Месяц'},{v:'q',l:'Квартал'},{v:'year',l:'Год'}
        ]}/>
        <div style={{fontSize:12,fontWeight:500}}>
          <span style={{color:C.gold,fontWeight:700}}>{cRange.label}</span>
          <span style={{color:C.textM}}> vs {pRange.label}</span>
        </div>
      </div>

      {/* ── BENTO GRID ── */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(12,1fr)',gap:16}}>

        {/* KPI row 1 — 5 равных карточек */}
        <div style={{gridColumn:'span 12',display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:16}}>
          <KPICard label="Брутто" value={fmt(curr.gross,currency,rate)} iconName="barChart"
            sub={fmtFull(curr.gross,currency,rate)} trend={trendPct(curr.gross,prev.gross)}/>
          <KPICard label="Нетто (себест.)" value={fmt(curr.net,currency,rate)} iconName="trendDn"
            sub={fmtFull(curr.net,currency,rate)} accent={C.blue}/>
          <KPICard label="Маржа" value={fmt(curr.margin,currency,rate)} iconName="trendUp"
            sub={fmtFull(curr.margin,currency,rate)} trend={trendPct(curr.margin,prev.margin)} accent={C.green}/>
          <KPICard label="Маржа %" value={fmtPct(curr.marginPct)} iconName="target"
            sub={`было ${fmtPct(prev.marginPct)}`} trend={trendPct(curr.marginPct,prev.marginPct)} accent={C.green}/>
          <KPICard label="Сделок" value={curr.count} iconName="check2"
            sub={`было ${prev.count}`} trend={trendPct(curr.count,prev.count)} accent={C.text}/>
        </div>

        {/* KPI row 2 */}
        <div style={{gridColumn:'span 12',display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:16}}>
          <KPICard label="Средний чек" value={fmt(curr.avgCheck,currency,rate)} iconName="star" accent={C.gold}/>
          <KPICard label="Ср. маржа / сделка" value={fmt(curr.avgMargin,currency,rate)} iconName="star" accent={C.gold}/>
          <KPICard label="Лучшее направление" value={bestDir?.dir||'—'} iconName="plane"
            sub={`маржа ${fmtPct(bestDir?.allPct||0)}`} accent={C.purple}/>
          <KPICard label="Лучший менеджер" value={bestMgr?.mgr||'—'} iconName="trophy"
            sub={`${fmt(bestMgr?.margin||0,currency,rate)} маржи`}/>
          <KPICard label="Дебиторка" value={fmt(totalDebt,currency,rate)} iconName="warn"
            sub={`${recv.length} клиентов`} accent={C.red}/>
        </div>

        {/* Monthly chart (8 cols) */}
        <Card style={{gridColumn:'span 8'}}>
          <SecTitle icon="barChart">Финансы по месяцам</SecTitle>
          <ResponsiveContainer width="100%" height={255}>
            <BarChart data={monthlyChart} margin={{top:8,right:8,left:0,bottom:0}} barCategoryGap="28%">
              <CartesianGrid stroke="rgba(15,23,42,0.05)" strokeDasharray="0" vertical={false}/>
              <XAxis dataKey="month" {...AXIS_STYLE}/>
              <YAxis tickFormatter={v=>fmt(v,currency,rate)} {...AXIS_STYLE} width={72}/>

                    color:C.text,fontSize:12,outline:'none',textAlign:'right',
                    fontFamily:"'Plus Jakarta Sans',sans-serif",
                    boxShadow:C.shadowSm}}/>
                <span style={{fontSize:11,color:C.textM,fontWeight:500}}>сум/$</span>
              </div>
            )}

            {/* API settings button */}
            <button onClick={()=>setSS(true)}
              style={{display:'flex',alignItems:'center',gap:6,
                padding:'7px 14px',borderRadius:10,
                border:`1px solid ${C.borderD}`,
                background:C.glassSolid,color:C.textS,cursor:'pointer',
                fontSize:12,fontWeight:600,
                fontFamily:"'Plus Jakarta Sans',sans-serif",
                boxShadow:C.shadowSm,transition:'all .15s'}}>
              <Ic n="gear" s={13} c={C.textM}/>
              Настройки API
            </button>

            {/* Last update */}
            <div style={{fontSize:10,color:C.textM,fontWeight:500}}>
              {lastUp.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}
            </div>
          </div>
        </div>
      </div>

      {/* ── TAB CONTENT ── */}
      <div style={{paddingTop:32,position:'relative',zIndex:1}}>
        {tab==='op'&&<Tab1 currency={cur} rate={rate}/>}
        {tab==='an'&&<Tab2 currency={cur} rate={rate}/>}
      </div>

      {showSettings&&<SettingsModal onClose={()=>setSS(false)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
