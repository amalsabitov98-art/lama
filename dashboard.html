// ── DEMO DATA (unchanged) ─────────────────────────────────────
const MANAGERS=['Муслим','Абдулкарим','Сарвинос','Азиза'];
const DIRECTIONS=['Дубай','Турция','Египет','Европа','Таиланд'];
const MRATES={Дубай:.15,Турция:.12,Египет:.14,Европа:.18,Таиланд:.16};
const FUNNEL_STAGES=['Новый лид','Требует контакта','Проинформирован','Визит в офис','Оплачено'];
const EXTRA_STAGES=['Отложенные','Нецелевой'];
const ALL_STAGES=[...FUNNEL_STAGES,...EXTRA_STAGES];

function makeRng(seed){let s=seed>>>0;return()=>{s^=s<<13;s^=s>>17;s^=s<<5;return(s>>>0)/4294967296;};}
function wChoice(rng,w){let c=0,r=rng();for(let i=0;i<w.length;i++){c+=w[i];if(r<c)return i;}return w.length-1;}
function genDeals(){
  const rng=makeRng(31337);
  const clients=['Алишер Т.','Нилуфар К.','Бобур М.','Гулнора Р.','Санжар Х.',
    'Диля А.','Отабек Ю.','Малика С.','Феруз Н.','Зиёда К.',
    'Рустам Б.','Лола Ш.','Жамшид В.','Насиба О.','Камол Т.',
    'Умида Р.','Шохрух А.','Барно И.','Дилшод Н.','Мадина Х.'];
  const mW=[.32,.25,.23,.20],dW=[.28,.26,.19,.14,.13],aW=[.22,.20,.24,.18,.10,.06];
  const months=[
    {y:2026,m:0,n:23,pp:.88,gb:3e6,gr:16e6},{y:2026,m:1,n:18,pp:.85,gb:2.5e6,gr:14e6},
    {y:2026,m:2,n:25,pp:.88,gb:3.5e6,gr:18e6},{y:2026,m:3,n:28,pp:.90,gb:4e6,gr:20e6},
    {y:2026,m:4,n:24,pp:.87,gb:3e6,gr:18e6},{y:2026,m:5,n:14,pp:.36,gb:2.5e6,gr:15e6},
  ];
  const deals=[];let id=1;
  for(const cfg of months){
    const {y,m,n,pp,gb,gr}=cfg;
    const maxD=(m===5)?11:new Date(y,m+1,0).getDate();
    for(let i=0;i<n;i++){
      const isPaid=rng()<pp;
      const day=Math.floor(rng()*maxD)+1;
      const ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
      const mgr=MANAGERS[wChoice(rng,mW)],dir=DIRECTIONS[wChoice(rng,dW)];
      const stage=isPaid?'Оплачено':ALL_STAGES[wChoice(rng,aW)];
      const gross=Math.round((gb+rng()*gr)/500000)*500000;
      const mr=MRATES[dir],net=Math.round(gross*(1-mr)/100000)*100000,margin=gross-net;
      let paid=0;
      if(stage==='Оплачено'){paid=rng()<.88?gross:Math.round(gross*(0.5+rng()*0.4)/500000)*500000;}
      else if((stage==='Визит в офис'||stage==='Проинформирован')&&rng()<.25){paid=Math.round(gross*0.3/500000)*500000;}
      const fd=new Date(y,m,day+7+Math.floor(rng()*60));
      deals.push({id:'TUR-'+String(id).padStart(3,'0'),date:ds,manager:mgr,
        client:clients[Math.floor(rng()*clients.length)],direction:dir,stage,
        gross,net,margin,marginPct:parseFloat((margin/gross*100).toFixed(1)),
        paid,balance:gross-paid,flightDate:fd.toISOString().slice(0,10),
        month:y+'-'+String(m+1).padStart(2,'0'),quarter:'Q'+Math.ceil((m+1)/3),year:y});
      id++;
    }
  }
  return deals.sort((a,b)=>a.date.localeCompare(b.date));
}
const DEMO_DEALS=genDeals();

// ── UTILS (unchanged) ─────────────────────────────────────────
function TODAY(){return new Date('2026-06-11');}
function fmt(val,cur,rate){
  cur=cur||'UZS';rate=rate||12700;
  const v=cur==='USD'?val/rate:val,av=Math.abs(v);
  const p=cur==='USD'?'$':'';
  if(av>=1e9)return p+(v/1e9).toFixed(1)+(cur==='USD'?' B':' млрд');
  if(av>=1e6)return p+(v/1e6).toFixed(1)+(cur==='USD'?' M':' млн');
  if(av>=1e3)return p+(v/1e3).toFixed(0)+(cur==='USD'?' K':' тыс');
  return p+Math.round(v)+(cur==='USD'?'':' сум');
}
function fmtFull(val,cur,rate){
  cur=cur||'UZS';rate=rate||12700;
  const v=cur==='USD'?val/rate:val;
  return cur==='USD'?'$'+v.toLocaleString('ru-RU',{maximumFractionDigits:0}):v.toLocaleString('ru-RU',{maximumFractionDigits:0})+' сум';
}
function fmtPct(v){return parseFloat(v).toFixed(1)+'%';}
function getMonthRange(offset){
  offset=offset||0;const d=TODAY();
  const start=new Date(d.getFullYear(),d.getMonth()+offset,1);
  const end=new Date(d.getFullYear(),d.getMonth()+offset+1,0);
  return{start:start.toISOString().slice(0,10),end:end.toISOString().slice(0,10),
    label:start.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})};
}
function getQuarterRange(offset){
  offset=offset||0;const d=TODAY();
  const q=Math.ceil((d.getMonth()+1)/3)+offset;
  const year=d.getFullYear()+Math.floor((q-1)/4);
  const qn=((q-1)%4+4)%4+1;
  const start=new Date(year,(qn-1)*3,1),end=new Date(year,qn*3,0);
  return{start:start.toISOString().slice(0,10),end:end.toISOString().slice(0,10),label:'Q'+qn+' '+year};
}
function filterD(deals,start,end){return deals.filter(function(d){return d.date>=start&&d.date<=end;});}
function daysSince(dateStr){return Math.floor((TODAY()-new Date(dateStr))/86400000);}
function calcStats(deals){
  const gross=deals.reduce(function(s,d){return s+d.gross;},0);
  const net=deals.reduce(function(s,d){return s+d.net;},0);
  const margin=deals.reduce(function(s,d){return s+d.margin;},0);
  const count=deals.length;
  return{gross,net,margin,count,avgCheck:count?gross/count:0,avgMargin:count?margin/count:0,marginPct:gross?margin/gross*100:0};
}
function trendPct(a,b){return b>0?(a-b)/b*100:0;}

function Ic(props){
  const n=props.n,s=props.s||16,c=props.c||'currentColor';
  const paths=SVG_PATHS[n]||'';
  const html='<svg xmlns="http://www.w3.org/2000/svg" width="'+s+'" height="'+s+
    '" viewBox="0 0 24 24" fill="none" stroke="'+c+
    '" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">'+paths+'</svg>';
  return React.createElement('span',{
    style:{display:'inline-flex',alignItems:'center',justifyContent:'center',flexShrink:0},
    dangerouslySetInnerHTML:{__html:html}
  });
}

    {style:{top:'42%',left:'28%',width:800,height:500,background:'radial-gradient(circle,rgba(201,168,76,0.14),transparent 70%)'}},
    {style:{bottom:'0',left:'5%',width:500,height:500,background:'radial-gradient(circle,rgba(16,185,129,0.12),transparent 70%)'}},
    {style:{bottom:'8%',right:'4%',width:450,height:450,background:'radial-gradient(circle,rgba(59,130,246,0.13),transparent 70%)'}},

}

function Card(props){
  const [h,setH]=useState(false);
  return(
    <div
      onMouseEnter={function(){setH(true);}}
      onMouseLeave={function(){setH(false);}}
      style={Object.assign({
        background:C.glass,backdropFilter:'blur(40px)',WebkitBackdropFilter:'blur(40px)',
        borderRadius:24,border:'1px solid '+C.border,
        boxShadow:h?C.shH:C.sh,padding:24,
        transition:'box-shadow .25s ease,transform .25s ease',
        transform:h?'translateY(-1px)':'none',
        position:'relative',zIndex:1,

    </div>
  );

// ── TAB 1 — ОПЕРАТИВКА ────────────────────────────────────────
function Tab1(props){
  const currency=props.currency,rate=props.rate;
  const [period,setPeriod]=useState('current');
  const [csStart,setCS]=useState('2026-01-01');
  const [csEnd,setCE]=useState('2026-06-11');
  const [goal,setGoal]=useState(100000000);
  const [goalEdit,setGE]=useState(false);
  const [goalInput,setGI]=useState('100000000');

  const range=useMemo(function(){
    if(period==='current')return getMonthRange(0);
    if(period==='prev')return getMonthRange(-1);
    return{start:csStart,end:csEnd,label:csStart+' — '+csEnd};
  },[period,csStart,csEnd]);

  const deals=useMemo(function(){return filterD(DEMO_DEALS,range.start,range.end);},[range]);
  const paid=deals.filter(function(d){return d.stage==='Оплачено';});
  const active=deals.filter(function(d){return d.stage!=='Оплачено'&&d.stage!=='Нецелевой';});
  const qual=deals.filter(function(d){return d.stage!=='Нецелевой';});
  const totalGross=paid.reduce(function(s,d){return s+d.gross;},0);
  const conv=qual.length?paid.length/qual.length*100:0;
  const progress=Math.min(totalGross/goal*100,100);

  const mgrStats=useMemo(function(){
    return MANAGERS.map(function(mgr){
      const md=deals.filter(function(d){return d.manager===mgr;});
      const mp=md.filter(function(d){return d.stage==='Оплачено';});
      const mq=md.filter(function(d){return d.stage!=='Нецелевой';});
      const gross=mp.reduce(function(s,d){return s+d.gross;},0);
      return{mgr,all:md.length,paid:mp.length,gross,
        conv:mq.length?mp.length/mq.length*100:0,
        avg:mp.length?gross/mp.length:0};
    }).sort(function(a,b){return b.gross-a.gross;});
  },[deals]);

  const leader=mgrStats[0],lagger=mgrStats[mgrStats.length-1];

  const funnelData=FUNNEL_STAGES.map(function(s){
    return{s:s,n:deals.filter(function(d){return d.stage===s;}).length};
  });
  const extraData=EXTRA_STAGES.map(function(s){
    return{s:s,n:deals.filter(function(d){return d.stage===s;}).length};
  });
  const fMax=funnelData[0]?funnelData[0].n:1;

  const dailyData=useMemo(function(){
    const map={};
    paid.forEach(function(d){map[d.date]=(map[d.date]||0)+d.gross;});
    return Object.entries(map).sort().map(function(e){return{date:e[0].slice(5),gross:e[1]};});
  },[paid]);

          <div style={{display:'flex',flexDirection:'column',gap:5}}>

                      <div style={{width:w+'%',height:'100%',borderRadius:8,background:col,

        {/* Manager ratings (7 cols) */}

          <div style={{display:'flex',flexDirection:'column',gap:10}}>

                <div key={m.mgr} style={{display:'flex',alignItems:'center',gap:14,
                  padding:'12px 16px',borderRadius:16,

// ── TAB 2 — АНАЛИТИКА ─────────────────────────────────────────
const MONTHS=['2026-01','2026-02','2026-03','2026-04','2026-05','2026-06'];
const MLABELS={'2026-01':'Янв','2026-02':'Фев','2026-03':'Мар','2026-04':'Апр','2026-05':'Май','2026-06':'Июн'};

function Tab2(props){
  const currency=props.currency,rate=props.rate;
  const [period,setPeriod]=useState('month');
  const CLOSED=useMemo(function(){return DEMO_DEALS.filter(function(d){return d.stage==='Оплачено';});},[]);

  const ranges=useMemo(function(){
    if(period==='month')return{c:getMonthRange(0),p:getMonthRange(-1)};
    if(period==='q')return{c:getQuarterRange(0),p:getQuarterRange(-1)};
    const y=TODAY().getFullYear();
    return{c:{start:y+'-01-01',end:y+'-12-31',label:y+' год'},
      p:{start:(y-1)+'-01-01',end:(y-1)+'-12-31',label:(y-1)+' год'}};
  },[period]);

  const cRange=ranges.c,pRange=ranges.p;
  const curr=useMemo(function(){return calcStats(filterD(CLOSED,cRange.start,cRange.end));},[CLOSED,cRange]);
  const prev=useMemo(function(){return calcStats(filterD(CLOSED,pRange.start,pRange.end));},[CLOSED,pRange]);

  const recv=useMemo(function(){
    return DEMO_DEALS.filter(function(d){return d.balance>0&&d.paid>0;}).sort(function(a,b){return b.balance-a.balance;});
  },[]);
  const totalDebt=recv.reduce(function(s,d){return s+d.balance;},0);

  const dirStats=useMemo(function(){
    return DIRECTIONS.map(function(dir){
      const ad=CLOSED.filter(function(d){return d.direction===dir;});
      const ag=ad.reduce(function(s,d){return s+d.gross;},0);
      const am=ad.reduce(function(s,d){return s+d.margin;},0);
      return{dir,allGross:ag,allMargin:am,allPct:ag?am/ag*100:0};
    }).sort(function(a,b){return b.allPct-a.allPct;});
  },[CLOSED]);

  const bestDir=dirStats[0];

  const mgrStats=useMemo(function(){
    return MANAGERS.map(function(mgr){
      const cd=filterD(CLOSED,cRange.start,cRange.end).filter(function(d){return d.manager===mgr;});
      const g=cd.reduce(function(s,d){return s+d.gross;},0);
      const n=cd.reduce(function(s,d){return s+d.net;},0);
      const m=cd.reduce(function(s,d){return s+d.margin;},0);
      const cnt=cd.length;
      const monthly=MONTHS.map(function(mo){
        const md=CLOSED.filter(function(d){return d.manager===mgr&&d.month===mo;});
        return{month:MLABELS[mo],margin:md.reduce(function(s,d){return s+d.margin;},0)};
      });
      return{mgr,gross:g,net:n,margin:m,marginPct:g?m/g*100:0,count:cnt,avgCheck:cnt?g/cnt:0,monthly};
    }).sort(function(a,b){return b.margin-a.margin;});
  },[CLOSED,cRange]);

  const bestMgr=mgrStats[0];

  const monthlyChart=MONTHS.map(function(mo){
    const md=CLOSED.filter(function(d){return d.month===mo;});
    return{month:MLABELS[mo],
      gross:md.reduce(function(s,d){return s+d.gross;},0),
      net:md.reduce(function(s,d){return s+d.net;},0),
      margin:md.reduce(function(s,d){return s+d.margin;},0)};
  });

  const bestMonth=[...monthlyChart].sort(function(a,b){return b.margin-a.margin;})[0];
  const hasData=monthlyChart.filter(function(m){return m.gross>0;}).length>=3;
  const barColors=[C.green,C.blue,C.purple,C.yellow,C.textM];

  return(
    <div style={{padding:'0 28px 56px',maxWidth:1440,margin:'0 auto',position:'relative',zIndex:1}} className="fi">

      {/* Controls */}
      <div style={{display:'flex',gap:12,alignItems:'center',marginBottom:24,flexWrap:'wrap'}}>
        <SegCtrl value={period} onChange={setPeriod} options={[
          {v:'month',l:'Месяц'},{v:'q',l:'Квартал'},{v:'year',l:'Год'}
        ]}/>
        <div style={{fontSize:12,fontWeight:500}}>
          <span style={{color:C.gold,fontWeight:700}}>{cRange.label}</span>
          <span style={{color:C.textM}}> vs {pRange.label}</span>
        </div>
      </div>

      {/* BENTO GRID */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(12,1fr)',gap:16}}>

        {/* KPI row 1 */}
        <div style={{gridColumn:'span 12',display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:16}}>
          <KPICard label="Брутто" value={fmt(curr.gross,currency,rate)} iconName="bars"
            sub={fmtFull(curr.gross,currency,rate)} trend={trendPct(curr.gross,prev.gross)}/>
          <KPICard label="Нетто (себест.)" value={fmt(curr.net,currency,rate)} iconName="dn"
            sub={fmtFull(curr.net,currency,rate)} accent={C.blue}/>
          <KPICard label="Маржа" value={fmt(curr.margin,currency,rate)} iconName="up"
            sub={fmtFull(curr.margin,currency,rate)} trend={trendPct(curr.margin,prev.margin)} accent={C.green}/>
          <KPICard label="Маржа %" value={fmtPct(curr.marginPct)} iconName="target"
            sub={'было '+fmtPct(prev.marginPct)} trend={trendPct(curr.marginPct,prev.marginPct)} accent={C.green}/>
          <KPICard label="Сделок" value={curr.count} iconName="ok"
            sub={'было '+prev.count} trend={trendPct(curr.count,prev.count)} accent={C.text}/>
        </div>

        {/* KPI row 2 */}
        <div style={{gridColumn:'span 12',display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:16}}>
          <KPICard label="Средний чек" value={fmt(curr.avgCheck,currency,rate)} iconName="star" accent={C.gold}/>
          <KPICard label="Ср. маржа / сделка" value={fmt(curr.avgMargin,currency,rate)} iconName="star" accent={C.gold}/>
          <KPICard label="Лучшее направление" value={bestDir?bestDir.dir:'—'} iconName="plane"
            sub={'маржа '+fmtPct(bestDir?bestDir.allPct:0)} accent={C.purple}/>
          <KPICard label="Лучший менеджер" value={bestMgr?bestMgr.mgr:'—'} iconName="trophy"
            sub={fmt(bestMgr?bestMgr.margin:0,currency,rate)+' маржи'}/>
          <KPICard label="Дебиторка" value={fmt(totalDebt,currency,rate)} iconName="warn"
            sub={recv.length+' клиентов'} accent={C.red}/>
        </div>

        {/* Monthly chart (8 cols) */}
        <Card style={{gridColumn:'span 8'}}>
          <SecTitle icon="bars">Финансы по месяцам</SecTitle>
          <ResponsiveContainer width="100%" height={255}>
            <BarChart data={monthlyChart} margin={{top:8,right:8,left:0,bottom:0}} barCategoryGap="28%">
              <CartesianGrid stroke="rgba(15,23,42,0.05)" strokeDasharray="0" vertical={false}/>
              <XAxis dataKey="month" {...AX}/>
              <YAxis tickFormatter={function(v){return fmt(v,currency,rate);}} {...AX} width={72}/>
              <Tooltip {...TTIP_STYLE} formatter={function(v,name){return[fmtFull(v,currency,rate),name];}}/>
              <Legend wrapperStyle={{color:C.textS,fontSize:12,fontFamily:"'Plus Jakarta Sans',sans-serif",paddingTop:8}}/>
              <Bar dataKey="gross" name="Брутто" fill={C.blue} fillOpacity={0.75} radius={[8,8,0,0]}/>
              <Bar dataKey="net" name="Нетто" fill={C.gold} fillOpacity={0.75} radius={[8,8,0,0]}/>
              <Bar dataKey="margin" name="Маржа" fill={C.green} fillOpacity={0.85} radius={[8,8,0,0]}/>
            </BarChart>
          </ResponsiveContainer>
        </Card>

        {/* Insights (4 cols) */}
        <Card style={{gridColumn:'span 4'}}>
          <SecTitle icon="zap">Тренды и инсайты</SecTitle>
          {hasData?(
            <div style={{display:'flex',flexDirection:'column',gap:12}}>
              <div style={{padding:'14px 16px',background:C.greenBg,borderRadius:16,border:'1px solid rgba(5,150,105,0.15)'}}>
                <div style={{fontSize:10,fontWeight:700,color:C.textM,textTransform:'uppercase',letterSpacing:'.1em',marginBottom:10}}>Топ-3 по марже</div>
                {dirStats.slice(0,3).map(function(d,i){
                  return(
                    <div key={d.dir} style={{display:'flex',justifyContent:'space-between',alignItems:'center',fontSize:13,marginBottom:i<2?6:0}}>
                      <div style={{display:'flex',alignItems:'center',gap:6}}>
                        <div style={{width:18,height:18,borderRadius:6,background:C.green,display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,fontWeight:800,color:'#fff'}}>{i+1}</div>
                        <span style={{fontWeight:600}}>{d.dir}</span>
                      </div>
                      <span style={{color:C.green,fontWeight:700}}>{fmtPct(d.allPct)}</span>
                    </div>
                  );
                })}
              </div>
              <div style={{padding:'14px 16px',background:C.goldBg,borderRadius:16,border:'1px solid '+C.goldBr}}>
                <div style={{fontSize:10,fontWeight:700,color:C.textM,textTransform:'uppercase',letterSpacing:'.1em',marginBottom:6}}>Лучший месяц</div>
                <div style={{fontSize:22,fontWeight:800,color:C.gold,letterSpacing:'-.02em'}}>{bestMonth?bestMonth.month:'—'}</div>
                <div style={{fontSize:12,color:C.textS,fontWeight:500}}>маржа {fmt(bestMonth?bestMonth.margin:0,currency,rate)}</div>
              </div>
              <div style={{padding:'14px 16px',background:C.redBg,borderRadius:16,border:'1px solid rgba(220,38,38,0.15)'}}>
                <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:6}}>
                  <Ic n="warn" s={12} c={C.red}/>
                  <span style={{fontSize:10,fontWeight:700,color:C.textM,textTransform:'uppercase',letterSpacing:'.1em'}}>Минимальная маржа</span>
                </div>
                <div style={{fontSize:14,fontWeight:700}}>{dirStats[dirStats.length-1]?dirStats[dirStats.length-1].dir:'—'}</div>
                <div style={{fontSize:12,color:C.red,fontWeight:600,marginTop:2}}>
                  {fmtPct(dirStats[dirStats.length-1]?dirStats[dirStats.length-1].allPct:0)} — самая низкая маржа
                </div>
              </div>
            </div>
          ):(
            <div style={{color:C.textM,fontSize:13,fontWeight:500}}>Недостаточно данных (нужно ≥ 3 месяца)</div>
          )}
        </Card>

        {/* Directions (5 cols) */}
        <Card style={{gridColumn:'span 5'}}>
          <SecTitle icon="plane">Рейтинг направлений (маржа %)</SecTitle>
          <div style={{display:'flex',flexDirection:'column',gap:14}}>
            {dirStats.map(function(d,i){
              return(
                <div key={d.dir}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
                    <div style={{display:'flex',alignItems:'center',gap:8}}>
                      <div style={{width:22,height:22,borderRadius:7,background:barColors[i]+'20',
                        display:'flex',alignItems:'center',justifyContent:'center',
                        fontSize:11,fontWeight:800,color:barColors[i]}}>{i+1}</div>
                      <span style={{fontSize:14,fontWeight:700}}>{d.dir}</span>
                      <span style={{fontSize:11,color:C.textM,fontWeight:500}}>{fmt(d.allGross,currency,rate)}</span>
                    </div>
                    <div>
                      <span style={{fontSize:14,fontWeight:800,color:barColors[i]}}>{fmtPct(d.allPct)}</span>
                      <span style={{fontSize:11,color:C.textM,fontWeight:500,marginLeft:6}}>{fmt(d.allMargin,currency,rate)}</span>
                    </div>
                  </div>
                  <div style={{background:'rgba(15,23,42,0.06)',borderRadius:6,height:7,overflow:'hidden'}}>
                    <div style={{width:(d.allPct/20*100)+'%',height:'100%',borderRadius:6,
                      background:barColors[i],transition:'width .6s cubic-bezier(.16,1,.3,1)'}}/>
                  </div>
                </div>
              );
            })}
          </div>
        </Card>

        {/* Comparison table (7 cols) */}
        <Card style={{gridColumn:'span 7'}}>
          <SecTitle icon="users">Сводная таблица менеджеров</SecTitle>
          <div style={{overflowX:'auto'}}>
            <table style={{width:'100%',borderCollapse:'collapse',fontSize:13}}>
              <thead>
                <tr>
                  {['Менеджер','Сделок','Брутто','Нетто','Маржа','Маржа %','Ср. чек'].map(function(h){
                    return(
                      <th key={h} style={{textAlign:h==='Менеджер'?'left':'right',
                        padding:'8px 12px',color:C.textM,fontWeight:700,fontSize:10,
                        textTransform:'uppercase',letterSpacing:'.08em',
                        borderBottom:'1px solid '+C.borderD}}>{h}</th>
                    );
                  })}
                </tr>
              </thead>
              <tbody>
                {mgrStats.map(function(m,i){
                  return(
                    <tr key={m.mgr} style={{background:i%2?C.stripe:'transparent'}}>
                      <td style={{padding:'10px 12px',fontWeight:700}}>{m.mgr}</td>
                      <td style={{padding:'10px 12px',textAlign:'right',color:C.textS,fontWeight:500}}>{m.count}</td>
                      <td style={{padding:'10px 12px',textAlign:'right',fontWeight:600}}>{fmt(m.gross,currency,rate)}</td>
                      <td style={{padding:'10px 12px',textAlign:'right',color:C.textS,fontWeight:500}}>{fmt(m.net,currency,rate)}</td>
                      <td style={{padding:'10px 12px',textAlign:'right',color:C.green,fontWeight:700}}>{fmt(m.margin,currency,rate)}</td>
                      <td style={{padding:'10px 12px',textAlign:'right'}}>
                        <span style={{color:C.green,background:C.greenBg,padding:'2px 8px',borderRadius:8,fontSize:12,fontWeight:700}}>
                          {fmtPct(m.marginPct)}
                        </span>
                      </td>
                      <td style={{padding:'10px 12px',textAlign:'right',color:C.gold,fontWeight:700}}>{fmt(m.avgCheck,currency,rate)}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </Card>

        {/* Manager cards (12 cols) */}
        <Card style={{gridColumn:'span 12'}}>
          <SecTitle icon="users">{'Менеджеры — финансы ('+cRange.label+')'}</SecTitle>
          <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:16}}>
            {mgrStats.map(function(m,i){
              const bAccent=[C.goldBr,'rgba(59,130,246,0.25)','rgba(124,58,237,0.2)','rgba(15,23,42,0.08)'];
              const bBg=[C.goldBg,C.blueBg,C.purpleBg,'rgba(15,23,42,0.02)'];
              const stats=[
                {l:'Брутто',v:fmt(m.gross,currency,rate),c:C.text},
                {l:'Нетто',v:fmt(m.net,currency,rate),c:C.textS},
                {l:'Маржа',v:fmt(m.margin,currency,rate),c:C.green},
                {l:'Маржа %',v:fmtPct(m.marginPct),c:C.green},
                {l:'Сделок',v:m.count,c:C.text},
                {l:'Ср. чек',v:fmt(m.avgCheck,currency,rate),c:C.gold},
              ];
              return(
                <div key={m.mgr} style={{background:bBg[i],borderRadius:20,padding:18,border:'1px solid '+bAccent[i]}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
                    <span style={{fontWeight:800,fontSize:16}}>{m.mgr}</span>
                    {i===0&&(
                      <span style={{display:'inline-flex',alignItems:'center',gap:4,padding:'3px 10px',borderRadius:20,fontSize:11,fontWeight:700,color:C.gold,background:C.goldBg}}>
                        <Ic n="trophy" s={10} c={C.gold}/>Топ
                      </span>
                    )}
                  </div>
                  <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:14}}>
                    {stats.map(function(it){
                      return(
                        <div key={it.l} style={{background:'rgba(255,255,255,0.5)',borderRadius:10,padding:'8px 10px'}}>
                          <div style={{fontSize:10,color:C.textM,fontWeight:600,marginBottom:3,textTransform:'uppercase',letterSpacing:'.06em'}}>{it.l}</div>
                          <div style={{fontSize:14,fontWeight:800,color:it.c,letterSpacing:'-.01em'}}>{it.v}</div>
                        </div>
                      );
                    })}
                  </div>
                  <div style={{background:'rgba(255,255,255,0.5)',borderRadius:12,padding:'6px 4px'}}>
                    <ResponsiveContainer width="100%" height={48}>
                      <AreaChart data={m.monthly} margin={{top:4,right:4,left:4,bottom:0}}>
                        <defs>
                          <linearGradient id={'mf'+i} x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stopColor={C.gold} stopOpacity={0.25}/>
                            <stop offset="100%" stopColor={C.gold} stopOpacity={0}/>
                          </linearGradient>
                        </defs>
                        <Area type="monotone" dataKey="margin" stroke={C.gold} strokeWidth={2}
                          fill={'url(#mf'+i+')'} dot={false}/>
                      </AreaChart>
                    </ResponsiveContainer>
                  </div>
                </div>
              );
            })}
          </div>
        </Card>

        {/* Receivables (12 cols) */}
        <Card style={{gridColumn:'span 12'}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:18}}>
            <div style={{display:'flex',alignItems:'center',gap:8}}>
              <div style={{width:28,height:28,borderRadius:8,background:C.redBg,display:'flex',alignItems:'center',justifyContent:'center'}}>
                <Ic n="warn" s={14} c={C.red}/>
              </div>
              <span style={{fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'.12em',color:C.textM}}>Дебиторка</span>
            </div>
            <div>
              <span style={{fontSize:18,fontWeight:800,color:C.red,letterSpacing:'-.02em'}}>{fmtFull(totalDebt,currency,rate)}</span>
              <span style={{fontSize:12,color:C.textM,fontWeight:500,marginLeft:8}}>{recv.length} клиентов</span>
            </div>
          </div>
          {recv.length>0?(
            <div style={{overflowX:'auto'}}>
              <table style={{width:'100%',borderCollapse:'collapse',fontSize:13}}>
                <thead>
                  <tr>
                    {['Клиент','Менеджер','Направление','Брутто','Оплачено','Остаток','Возраст'].map(function(h){
                      return(
                        <th key={h} style={{textAlign:h==='Клиент'?'left':'right',
                          padding:'8px 12px',color:C.textM,fontWeight:700,fontSize:10,
                          textTransform:'uppercase',letterSpacing:'.08em',
                          borderBottom:'1px solid '+C.borderD}}>{h}</th>
                      );
                    })}
                  </tr>
                </thead>
                <tbody>
                  {recv.map(function(d,i){
                    const age=daysSince(d.date);
                    const ac=age<7?C.green:age<30?C.yellow:C.red;
                    const ab=age<7?C.greenBg:age<30?C.yellowBg:C.redBg;
                    return(
                      <tr key={d.id} style={{background:i%2?C.stripe:'transparent'}}>
                        <td style={{padding:'10px 12px',fontWeight:700}}>{d.client}</td>
                        <td style={{padding:'10px 12px',textAlign:'right',color:C.textS,fontWeight:500}}>{d.manager}</td>
                        <td style={{padding:'10px 12px',textAlign:'right',fontWeight:600}}>{d.direction}</td>
                        <td style={{padding:'10px 12px',textAlign:'right',fontWeight:600}}>{fmt(d.gross,currency,rate)}</td>
                        <td style={{padding:'10px 12px',textAlign:'right',color:C.green,fontWeight:600}}>{fmt(d.paid,currency,rate)}</td>
                        <td style={{padding:'10px 12px',textAlign:'right',color:C.red,fontWeight:800}}>{fmt(d.balance,currency,rate)}</td>
                        <td style={{padding:'10px 12px',textAlign:'right'}}>
                          <span style={{color:ac,fontWeight:700,background:ab,padding:'3px 10px',borderRadius:20,fontSize:11}}>{age} дн.</span>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          ):(
            <div style={{color:C.textM,fontSize:13,fontWeight:500,padding:'12px 0'}}>Дебиторки нет</div>
          )}
        </Card>
      </div>
    </div>
  );
}

// ── SETTINGS MODAL ────────────────────────────────────────────
function SettingsModal(props){
  const [sheetId,setSId]=useState('');
  const [apiKey,setAK]=useState('');
  const [status,setStatus]=useState(null);
  function test(){setStatus('loading');setTimeout(function(){setStatus('demo');},1800);}
  const inp={width:'100%',padding:'11px 14px',borderRadius:12,background:C.solid,
    border:'1px solid '+C.borderD,color:C.text,fontSize:13,outline:'none',
    fontFamily:"'Plus Jakarta Sans',sans-serif",boxShadow:C.shSm};
  return(
    <div onClick={function(e){if(e.target===e.currentTarget)props.onClose();}}
      style={{position:'fixed',inset:0,background:'rgba(15,23,42,0.35)',
        backdropFilter:'blur(8px)',WebkitBackdropFilter:'blur(8px)',
        display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000}}>
      <div className="fi" style={{background:'rgba(255,255,255,0.88)',
        backdropFilter:'blur(40px)',WebkitBackdropFilter:'blur(40px)',
        border:'1px solid rgba(255,255,255,0.8)',borderRadius:28,padding:36,width:500,
        boxShadow:'inset 0 2px 3px rgba(255,255,255,0.9),0 32px 80px rgba(15,23,42,0.18)'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:28}}>
          <div>
            <h2 style={{fontSize:20,fontWeight:800,letterSpacing:'-.02em',marginBottom:2}}>Подключение Google Sheets</h2>
            <p style={{fontSize:12,color:C.textM,fontWeight:500}}>Введите данные для подключения к таблице</p>
          </div>
          <button onClick={props.onClose}
            style={{width:32,height:32,borderRadius:10,border:'none',cursor:'pointer',
              background:'rgba(15,23,42,0.06)',display:'flex',alignItems:'center',justifyContent:'center'}}>
            <Ic n="close" s={14} c={C.textS}/>
          </button>
        </div>
        <div style={{marginBottom:16}}>
          <label style={{fontSize:12,color:C.textS,fontWeight:600,display:'flex',alignItems:'center',gap:6,marginBottom:7}}>
            <Ic n="link" s={13} c={C.textM}/>Google Sheets ID
          </label>
          <input value={sheetId} onChange={function(e){setSId(e.target.value);}}
            placeholder="1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs74OgVE2upms" style={inp}/>
        </div>
        <div style={{marginBottom:20}}>
          <label style={{fontSize:12,color:C.textS,fontWeight:600,display:'flex',alignItems:'center',gap:6,marginBottom:7}}>
            <Ic n="gear" s={13} c={C.textM}/>API Key (Google Cloud)
          </label>
          <input value={apiKey} onChange={function(e){setAK(e.target.value);}}
            placeholder="AIzaSy..." style={inp}/>
        </div>
        <button onClick={test} disabled={status==='loading'}
          style={{width:'100%',padding:'13px',borderRadius:14,border:'none',cursor:'pointer',
            background:C.gold,color:'#0F172A',fontWeight:800,fontSize:14,
            fontFamily:"'Plus Jakarta Sans',sans-serif",marginBottom:12,
            boxShadow:'0 4px 16px rgba(201,168,76,0.3)',
            opacity:status==='loading'?0.7:1,transition:'opacity .15s'}}>
          {status==='loading'?'Проверка подключения...':'Проверить подключение'}
        </button>
        {status==='demo'&&(
          <div style={{padding:'12px 16px',background:C.yellowBg,borderRadius:14,fontSize:13,
            color:C.yellow,marginBottom:12,fontWeight:600,
            border:'1px solid rgba(217,119,6,0.2)',display:'flex',alignItems:'center',gap:8}}>
            <Ic n="warn" s={14} c={C.yellow}/>
            API недоступен. Дашборд работает в режиме Demo.
          </div>
        )}
        <p style={{fontSize:11,color:C.textM,lineHeight:1.7,fontWeight:500}}>
          После подключения данные обновляются каждые 60 сек. API ключ создаётся
          в Google Cloud Console → APIs &amp; Services → Credentials.
        </p>
      </div>
    </div>
  );
}

// ── APP ───────────────────────────────────────────────────────
function App(){
  const [tab,setTab]=useState('op');
  const [cur,setCur]=useState('UZS');
  const [rate,setRate]=useState(12700);
  const [rateInput,setRI]=useState('12700');
  const [showSettings,setSS]=useState(false);
  const [lastUp,setLU]=useState(new Date('2026-06-11T10:42:00'));

  useEffect(function(){
    const t=setInterval(function(){setLU(new Date());},60000);
    return function(){clearInterval(t);};
  },[]);

  const navTabs=[{id:'op',l:'Оперативка',icon:'zap'},{id:'an',l:'Аналитика',icon:'bars'}];
  const curOpts=[{c:'UZS',l:'сум'},{c:'USD',l:'$'}];

  return(
    <div style={{minHeight:'100vh',background:C.bg,color:C.text}}>
      <Mesh/>

      {/* GLASS HEADER */}
      <div style={{background:C.header,backdropFilter:'blur(24px)',WebkitBackdropFilter:'blur(24px)',
        borderBottom:'1px solid rgba(15,23,42,0.07)',position:'sticky',top:0,zIndex:200}}>
        <div style={{maxWidth:1440,margin:'0 auto',display:'flex',alignItems:'center',
          height:64,padding:'0 28px'}}>

          <div style={{marginRight:40,flexShrink:0}}>
            <div style={{fontSize:18,fontWeight:900,letterSpacing:'.02em',lineHeight:1.1}}>
              <span style={{color:C.gold}}>TURON</span>
              <span style={{color:C.text}}> TOURISM</span>
            </div>
            <div style={{fontSize:9,color:C.textM,letterSpacing:'.18em',textTransform:'uppercase',fontWeight:600,marginTop:1}}>
              Ташкент · Узбекистан
            </div>
          </div>

          <div style={{display:'flex',height:'100%',marginRight:'auto'}}>
            {navTabs.map(function(t){
              const active=tab===t.id;
              return(
                <button key={t.id} onClick={function(){setTab(t.id);}}
                  style={{height:'100%',padding:'0 22px',border:'none',cursor:'pointer',
                    background:'none',display:'flex',alignItems:'center',gap:7,
                    fontSize:14,fontWeight:active?700:500,
                    fontFamily:"'Plus Jakarta Sans',sans-serif",
                    color:active?C.gold:C.textS,
                    borderBottom:active?'2px solid '+C.gold:'2px solid transparent',
                    transition:'all .15s'}}>
                  <Ic n={t.icon} s={15} c={active?C.gold:C.textM}/>
                  {t.l}
                </button>
              );
            })}
          </div>

          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <span style={{padding:'4px 10px',borderRadius:20,background:C.yellowBg,
              border:'1px solid rgba(217,119,6,0.25)',color:C.yellow,fontSize:11,fontWeight:700,letterSpacing:'.06em'}}>
              DEMO
            </span>

            <div style={{display:'inline-flex',gap:2,padding:3,background:'rgba(15,23,42,0.05)',
              borderRadius:10,border:'1px solid rgba(15,23,42,0.06)'}}>
              {curOpts.map(function(o){
                const active=cur===o.c;
                return(
                  <button key={o.c} onClick={function(){setCur(o.c);}}
                    style={{padding:'4px 12px',borderRadius:7,border:'none',cursor:'pointer',
                      background:active?'#FFFFFF':'transparent',
                      color:active?C.text:C.textS,fontSize:12,fontWeight:700,
                      fontFamily:"'Plus Jakarta Sans',sans-serif",
                      boxShadow:active?'0 1px 4px rgba(15,23,42,0.12)':'none',
                      transition:'all .15s'}}>
                    {o.l}
                  </button>
                );
              })}
            </div>

            {cur==='USD'&&(
              <div style={{display:'flex',alignItems:'center',gap:5}}>
                <span style={{fontSize:11,color:C.textM,fontWeight:500}}>курс:</span>
                <input value={rateInput}
                  onChange={function(e){setRI(e.target.value);}}
                  onBlur={function(){setRate(+rateInput||rate);}}
                  onKeyDown={function(e){if(e.key==='Enter')setRate(+rateInput||rate);}}
                  style={{width:80,padding:'5px 9px',borderRadius:10,background:C.solid,
                    border:'1px solid '+C.borderD,color:C.text,fontSize:12,outline:'none',
                    textAlign:'right',fontFamily:"'Plus Jakarta Sans',sans-serif",boxShadow:C.shSm}}/>
                <span style={{fontSize:11,color:C.textM,fontWeight:500}}>сум/$</span>
              </div>
            )}

            <button onClick={function(){setSS(true);}}
              style={{display:'flex',alignItems:'center',gap:6,padding:'7px 14px',borderRadius:10,
                border:'1px solid '+C.borderD,background:C.solid,color:C.textS,cursor:'pointer',
                fontSize:12,fontWeight:600,fontFamily:"'Plus Jakarta Sans',sans-serif",
                boxShadow:C.shSm,transition:'all .15s'}}>
              <Ic n="gear" s={13} c={C.textM}/>
              Настройки API
            </button>

            <span style={{fontSize:10,color:C.textM,fontWeight:500}}>
              {lastUp.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}
            </span>
          </div>
        </div>
      </div>

      <div style={{paddingTop:32,position:'relative',zIndex:1}}>
        {tab==='op'&&<Tab1 currency={cur} rate={rate}/>}
        {tab==='an'&&<Tab2 currency={cur} rate={rate}/>}
      </div>

      {showSettings&&<SettingsModal onClose={function(){setSS(false);}}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App,null));
  </script>
</body>
</html>
